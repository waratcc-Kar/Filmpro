<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<script src="/fp-sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ผู้ใช้ทีมงาน · FilmPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --paper: #F3F6F9; --ink: #121A24; --blue: #1D5BE3; --line: #DCE3EA; --muted: #5B6B7B; --bad: #C2410C; --ok: #15803D; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.5 Prompt, system-ui, sans-serif; padding-bottom: 4rem; }
header { display: flex; align-items: center; gap: .75rem; padding: .9rem 1rem; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
header b { font-size: 1.1rem; }
header nav { margin-left: auto; display: flex; gap: .4rem; flex-wrap: wrap; }
header nav a { color: var(--ink); text-decoration: none; font-size: .9rem; padding: .45rem .75rem; border: 1px solid var(--line); border-radius: 999px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 1.25rem 1rem; }
h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
.muted { color: var(--muted); }
.card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 1rem; margin: 1rem 0; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
label { display: block; font-size: .88rem; font-weight: 500; margin-bottom: .25rem; }
input, select { width: 100%; font: inherit; padding: .6rem .75rem; border: 1px solid var(--line); border-radius: 10px; background: #fff; min-height: 46px; color: var(--ink); }
button { font: 600 .95rem Prompt, system-ui, sans-serif; min-height: 44px; padding: .5rem 1rem; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
button.pri { background: var(--blue); border-color: var(--blue); color: #fff; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(29,91,227,.35); outline-offset: 1px; }
.row { display: flex; align-items: center; gap: .75rem; padding: .85rem 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.row:first-child { border-top: 0; }
.who { flex: 1; min-width: 180px; }
.who b { display: block; }
.tag { font-size: .78rem; padding: .1rem .55rem; border-radius: 999px; background: var(--paper); color: var(--muted); margin-left: .35rem; font-weight: 500; }
.tag.admin { background: #E6EEFD; color: var(--blue); }
.off { opacity: .55; }
.acts { display: flex; gap: .4rem; flex-wrap: wrap; }
.msg { min-height: 1.4em; font-size: .92rem; margin: .5rem 0 0; }
.msg.bad { color: var(--bad); } .msg.good { color: var(--ok); }
</style>
</head>
<body>
<header><b style="white-space:nowrap">FilmPro ทีมงาน</b><nav><a href="/admin-v2">แอดมิน</a><a href="/tech">จัดการช่าง</a><a href="/inspect">งานช่าง</a></nav></header>
<div class="wrap">
  <h1>ผู้ใช้ทีมงาน</h1>
  <p class="muted">ช่างเข้าระบบที่ film.karnet.org/staff ด้วยเบอร์โทรและ PIN 6 หลัก ช่างเห็นเฉพาะหน้างานช่าง แอดมินเห็นทุกหน้า</p>

  <form class="card" id="add" novalidate>
    <b>เพิ่มผู้ใช้</b>
    <div class="grid" style="margin-top:.75rem">
      <div><label for="n">ชื่อ</label><input id="n" autocomplete="off"></div>
      <div><label for="p">เบอร์โทร</label><input id="p" type="tel" inputmode="tel" autocomplete="off"></div>
      <div><label for="r">สิทธิ์</label><select id="r"><option value="tech">ช่าง</option><option value="admin">แอดมิน</option></select></div>
      <div><label for="t">ผูกกับช่างในระบบ</label><select id="t"></select></div>
      <div><label for="pin">PIN 6 หลัก</label><input id="pin" inputmode="numeric" maxlength="6" autocomplete="off"></div>
      <div style="display:flex;align-items:flex-end"><button class="pri" type="submit" style="width:100%">เพิ่มผู้ใช้</button></div>
    </div>
    <p class="msg" id="addmsg" role="status"></p>
  </form>

  <div class="card"><b>ผู้ใช้ทั้งหมด</b><div id="list" style="margin-top:.25rem"></div><p class="msg" id="listmsg" role="status"></p></div>

  <form class="card" id="mypin" novalidate>
    <b>เปลี่ยน PIN ของฉัน</b>
    <div class="grid" style="margin-top:.75rem">
      <div><label for="o">PIN เดิม</label><input id="o" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></div>
      <div><label for="np">PIN ใหม่</label><input id="np" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div>
    </div>
    <div style="margin-top:.75rem"><button type="submit">เปลี่ยน PIN</button></div>
    <p class="msg" id="pinmsg" role="status"></p>
  </form>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ERR = { invalid: "กรอกชื่อ เบอร์ และ PIN 6 หลักให้ครบ", invalid_pin: "PIN ต้องเป็นตัวเลข 6 หลัก", phone_taken: "เบอร์นี้มีผู้ใช้แล้ว", self: "ปิดหรือลดสิทธิ์บัญชีตัวเองไม่ได้", bad_pin: "PIN เดิมไม่ถูกต้อง" };
const say = (el, t, ok) => { el.textContent = t; el.className = "msg " + (ok ? "good" : "bad"); };
async function call(method, url, data) { const r = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: data ? JSON.stringify(data) : undefined }); return { st: r.status, j: await r.json().catch(() => ({})) }; }
document.querySelectorAll("[inputmode=numeric]").forEach((i) => i.addEventListener("input", () => { i.value = i.value.replace(/\D/g, "").slice(0, 6); }));
const techs = (() => { try { const T = JSON.parse(localStorage.getItem("filmpro_tech_v1") || "{}"); return (T.inst || []).map((i) => ({ id: i.id, name: i.name })); } catch { return []; } })();
const techName = (id) => (techs.find((t) => t.id === id) || {}).name || id;
const techOpts = (sel) => `<option value="">ไม่ผูก</option>` + techs.map((t) => `<option value="${esc(t.id)}"${t.id === sel ? " selected" : ""}>${esc(t.name)} (${esc(t.id)})</option>`).join("");
$("t").innerHTML = techOpts("");
let users = [];
async function load() {
  const { st, j } = await call("GET", "/api/users");
  if (st !== 200) { say($("listmsg"), "โหลดรายชื่อไม่ได้"); return; }
  users = j.users;
  $("list").innerHTML = users.map((u) => `<div class="row${u.active ? "" : " off"}" data-id="${u.id}"><div class="who"><b>${esc(u.name)}<span class="tag ${u.role}">${u.role === "admin" ? "แอดมิน" : "ช่าง"}</span>${u.active ? "" : '<span class="tag">ปิดใช้งาน</span>'}</b><span class="muted">${esc(u.phone)}${u.tech_id ? " · " + esc(techName(u.tech_id)) : ""}</span></div><div class="acts"><button type="button" data-a="pin">ตั้ง PIN ใหม่</button><button type="button" data-a="role">${u.role === "admin" ? "เปลี่ยนเป็นช่าง" : "ให้สิทธิ์แอดมิน"}</button><button type="button" data-a="active">${u.active ? "ปิดใช้งาน" : "เปิดใช้งาน"}</button></div></div>`).join("") || '<p class="muted">ยังไม่มีผู้ใช้</p>';
}
$("list").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const u = users.find((x) => x.id === +b.closest(".row").dataset.id); if (!u) return;
  const base = { id: u.id, role: u.role, techId: u.tech_id };
  let data;
  if (b.dataset.a === "pin") { const pin = prompt(`PIN ใหม่ 6 หลักสำหรับ ${u.name}`); if (pin == null) return; data = { ...base, pin: pin.trim() }; }
  if (b.dataset.a === "role") data = { ...base, role: u.role === "admin" ? "tech" : "admin" };
  if (b.dataset.a === "active") { if (u.active && !confirm(`ปิดใช้งาน ${u.name}? เครื่องที่ล็อกอินอยู่จะถูกออกจากระบบทันที`)) return; data = { ...base, active: !u.active }; }
  const { st, j } = await call("POST", "/api/users", data);
  if (st === 200) { say($("listmsg"), "บันทึกแล้ว", true); load(); } else say($("listmsg"), ERR[j.error] || "บันทึกไม่สำเร็จ");
});
$("add").addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = { name: $("n").value, phone: $("p").value, role: $("r").value, techId: $("t").value, pin: $("pin").value };
  const { st, j } = await call("POST", "/api/users", data);
  if (st === 200) { say($("addmsg"), `เพิ่ม ${data.name} แล้ว ส่งเบอร์และ PIN ให้เขาเข้าที่ film.karnet.org/staff`, true); $("add").reset(); load(); }
  else say($("addmsg"), ERR[j.error] || "เพิ่มไม่สำเร็จ");
});
$("mypin").addEventListener("submit", async (e) => {
  e.preventDefault();
  const { st, j } = await call("POST", "/api/pin", { old: $("o").value, pin: $("np").value });
  if (st === 200) { say($("pinmsg"), "เปลี่ยน PIN แล้ว", true); $("mypin").reset(); } else say($("pinmsg"), ERR[j.error] || ERR.invalid_pin);
});
load();
</script>
</body>
</html>
