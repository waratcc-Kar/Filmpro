<script>
const KEY='filmpro_inspect_v1',HO_KEY='filmpro_handover_v1';
// Same panel keys as Part 3 (Handover PANELS) so pre-photos show as "ก่อนติดตั้ง"
const PANELS=[['front','บานหน้า'],['fl','คู่หน้า ซ้าย'],['fr','คู่หน้า ขวา'],['rl','คู่หลัง ซ้าย'],['rr','คู่หลัง ขวา'],['quarter','หูช้าง'],['fixed','บานตาย'],['rear','บานหลัง'],['sun1','ซันรูฟ 1'],['sun2','ซันรูฟ 2'],['roof','หลังคาแก้ว']];
const DEF_EXIST=['front','fl','fr','rl','rr','rear'];
const OPTIONAL=['quarter','fixed','sun1','sun2','roof'];
const ZONES=[['front','บานหน้า',['front']],['side','กระจกข้าง/หูช้าง',['fl','fr','rl','rr','quarter','fixed']],['rear','บานหลัง',['rear']],['sun','ซันรูฟ/หลังคาแก้ว',['sun1','sun2','roof']]];
const DEFECTS=[['scratch','รอยขีดข่วน'],['chip','กระจกบิ่น/หินกระเด็น'],['crack','กระจกร้าว'],['oldfilm','มีฟิล์มเดิม'],['sealant','ยาง/ซิลิโคนขอบเสื่อม'],['defrost','เส้นไล่ฝ้าชำรุด'],['sticker','สติกเกอร์/คราบกาว'],['body','ตำหนิตัวถัง/สี'],['interior','ตำหนิภายใน/แผงประตู'],['other','อื่น ๆ']];
const BRANDS=['3M','Lamina','V-KOOL','Hi-Kool','XPEL','LLumar','Huper Optik','Global','อื่น ๆ'];
const SHADES=['5','20','30','40','50','60','70','80'];
const ST_COLOR={'กำลังตรวจ':'bg-amber-100 text-amber-700','ตรวจแล้ว':'bg-emerald-100 text-emerald-700'};
const $=id=>document.getElementById(id),now=()=>new Date().toISOString(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D,cur=null,tab='board',ui={};
function blank(){return {jobs:[],ins:{},inst:{},seq:1};}
const nid=p=>p+(D.seq++).toString().padStart(4,'0');
function load(){try{D=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY))||{});}catch(e){D=blank();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){alert('พื้นที่เก็บข้อมูลเต็ม — ส่งออก JSON แล้วลบงานเก่า');}}
function reset(){D=blank();cur=null;tab='list';save();render();}
const job=id=>D.jobs.find(j=>j.id===id);
function I(){return D.ins[cur];}
function blankIns(){return {car:{plate:'',province:'',brand:'',model:'',year:'',color:''},exist:[...DEF_EXIST],photo:{},interior:null,defects:[],film:Object.fromEntries(ZONES.map(z=>[z[0],{brand:'',model:'',shade:''}])),ack:{inform:false,defects:false,film:false},sig:null,signer:'',status:'กำลังตรวจ',doneAt:null};}
function carStr(c){return [c.brand,c.model,c.year].filter(Boolean).join(' ')+(c.plate?` (${c.plate}${c.province?' '+c.province:''})`:'');}
function filmStr(h){return ZONES.filter(z=>zoneUsed(h,z)&&h.film[z[0]].brand).map(z=>{const f=h.film[z[0]];return `${z[1]}: ${f.brand} ${f.model}${f.shade?' '+f.shade+'%':''}`;}).join(' / ');}
const zoneUsed=(h,z)=>z[2].some(k=>h.exist.includes(k));
// ---------- image capture (compressed) ----------
function shrink(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=1024,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7));};im.src=r.result;};r.readAsDataURL(file);}
function photoBox(slot,src,label){return `<label class="block cursor-pointer">${src?`<img class="ph" src="${src}">`:`<div class="phx">📷 ${esc(label||'แตะเพื่อถ่ายรูป')}</div>`}<input type="file" accept="image/*" capture="environment" class="hidden" onchange="setPhoto('${slot}',this)"></label>`;}
function setPhoto(slot,inp){const f=inp.files[0];if(!f)return;shrink(f,u=>{const h=I();const [a,b]=slot.split(':');if(a==='p')h.photo[b]=u;else if(a==='in')h.interior=u;else if(a==='seal'){h.seal=h.seal||{};h.seal.photo=u;}else if(a==='d'){const d=h.defects.find(x=>x.id===b);if(d)d.photo=u;}save();render();});}
// ---------- validation ----------
function missing(h){const m=[];
 h.exist.forEach(k=>{if(!h.photo[k])m.push('รูป '+PANELS.find(p=>p[0]===k)[1]);});if(!h.interior)m.push('รูปภายในรถ');
 h.defects.forEach((d,i)=>{if(!d.photo)m.push(`รูปตำหนิ #${i+1}`);});
 if(!h.filmOk)m.push('ยืนยันฟิล์มตรงตามที่ลูกค้าเลือก');const jj=job(cur);if(needSeal(jj)){const sl=h.seal||{};if(!sl.photo)m.push('รูปซีลฟิล์ม');if(!sl.ok)m.push(sl.ok===false?'เลขซีลไม่ตรง — ห้ามติดตั้ง':'ตรวจเลขซีลฟิล์ม');}
 if(!h.ack.inform||!h.ack.defects||!h.ack.film)m.push('ลูกค้ารับทราบ (ติ๊กให้ครบ)');if(!h.sig)m.push('ลายเซ็นลูกค้า');return m;}
// ---------- views ----------
const STEPS=[['s1','1 ข้อมูลรถ'],['s2','2 ถ่ายรูปกระจก'],['s3','3 ตำหนิ'],['s4','4 ฟิล์ม'],['s5','5 ลูกค้ายืนยัน']];
function render(){const t=[['board','รอยืนยัน'],['list','งานของฉัน']].concat(cur?STEPS:[]),P=pub();$('tabs').innerHTML=`<select class="!w-auto !py-1 text-xs" onchange="setMe(this.value)"><option value="">👤 เลือกช่าง</option>${P.techs.map(x=>`<option value="${x.id}" ${x.id===ME?'selected':''}>${esc(x.id)} ${esc(x.name)} L${x.level}</option>`).join('')}</select>`+t.map(([k,n])=>`<button class="tab btn2 text-xs px-3 py-1 ${tab===k?'on':''}" onclick="go('${k}')">${n}${k==='board'?` <span class="pill bg-blue-600 text-white">${myOffers()}</span>`:''}</button>`).join('');
 $('app').innerHTML=tab==='board'?vBoard():tab==='list'?vList():jobHead()+({s1:vS1,s2:vS2,s3:vS3,s4:vS4,s5:vS5}[tab])();if(tab==='s5')initSig();badge();window.scrollTo(0,0);}
function go(t){tab=t;render();}
function open_(id){cur=id;if(D.seen)D.seen[id]=true;if(!D.ins[id]){const h=blankIns(),j=job(id);['plate','province','brand','model','year','color'].forEach(k=>h.car[k]=j[k]||'');if(!h.car.brand&&j.car){const p=j.car.split(' ');h.car.brand=p.shift();h.car.model=p.join(' ');}prefillBooking(h,j);D.ins[id]=h;}tab='s1';save();render();}
function jobHead(){const j=job(cur),h=I(),m=missing(h);return `<div class="card p-3 mb-3 flex justify-between items-center"><div><b>${esc(j.id)}</b> <span class="pill ${ST_COLOR[h.status]}">${h.status}</span><div class="text-xs text-gray-500">${esc(j.customer)} · ${esc(carStr(h.car)||'-')}</div></div><div class="text-xs ${m.length?'text-red-600':'text-emerald-600'}">${m.length?'ขาด '+m.length+' รายการ':'ครบ ✓'}</div></div>`;}
function nav(prev,next){return `<div class="flex gap-2 mt-3">${prev?`<button class="btn2 flex-1 py-3" onclick="go('${prev}')">← ย้อนกลับ</button>`:''}${next?`<button class="btn flex-1 py-3" onclick="go('${next}')">ถัดไป →</button>`:''}</div>`;}
function syncTech(){// pull assigned jobs from FilmPro Tech (Part 2) store on same origin
 try{const T=JSON.parse(localStorage.getItem('filmpro_tech_v1'));if(!T)return;(T.inst||[]).forEach(i=>{if(!D.inst[i.id])D.inst[i.id]={name:i.name};});let n=0;(T.jobs||[]).forEach(j=>{if(!job(j.id)){D.jobs.push(mkJob(j));n++;}});if(n)save();return n;}catch(e){return 0;}}
// ---- FilmPro Match (shared, identical in Inspect & Tech): eligibility + hybrid matching phases
const FPM=(()=>{const UP=s=>String(s||'').trim().toUpperCase(),J=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d;}catch(e){return d;}};
 const DEF={premium:['3M','STEK','XPEL','LLUMAR','HUPER OPTIK','V-KOOL'],premiumLevel:3,wsSunLevel:3,radius:{1:15,2:25,3:40,4:60},
  hiPrice:20000,assign:{confirmMin:30},match:{p1Min:15,topN:3,p3Min:60,w:{rating:45,level:15,dist:20,brand:10,load:10},maxLoad:5}};
 const T=()=>Date.now();
 function hav(a,b,c,d){const r=x=>x*Math.PI/180,dl=r(c-a),dg=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dg/2)**2;return 12742*Math.asin(Math.sqrt(h));}
 function pub(){const p=J('filmpro_techpub_v1',{techs:[]});const r={...DEF,...(p.rules||{})};r.match={...DEF.match,...(r.match||{}),w:{...DEF.match.w,...((r.match||{}).w||{})}};return {techs:p.techs||[],rules:r};}
 function reqOf(b,R){const fb=UP((b.film||{}).brand),prem=R.premium.map(UP).includes(fb),sr=!!b.sunroof&&b.sunroof!=='ไม่มี',ws=!!b.windshieldUpgrade;let lv=1,why=[];
  if(prem){lv=Math.max(lv,R.premiumLevel);why.push('ฟิล์มพรีเมียม');}if(sr||ws){lv=Math.max(lv,R.wsSunLevel);why.push(sr?b.sunroof:'อัปเกรดบานหน้า');}return {lv,prem,sr,ws,fb,why};}
 function load(id){const C=J('filmpro_claims_v1',{}),RT=J('filmpro_ratings_v1',{});return Object.entries(C).filter(([b,c])=>c&&c.tech===id&&!RT[b]).length;}
 function elig(t,b,R){const q=reqOf(b,R),no=[],g=b.geo||{};let km=null,area=false;
  if(t.status&&t.status!=='active')no.push('ยังไม่ผ่านการตรวจสอบจากบริษัท');
  const hi=q.prem||(+b.price||0)>(+R.hiPrice||Infinity);if(hi&&!t.verified)no.push('งานราคาสูง/ฟิล์มพรีเมียม ต้องเป็นช่าง Verified');
  if(b.date&&(t.off||[]).includes(b.date))no.push('ไม่ว่างวันที่ '+b.date);
  if(t.level<q.lv)no.push(`ต้องระดับ L${q.lv}+ (${q.why.join(', ')}) — คุณ L${t.level}`);
  if(q.prem&&!(t.brands||[]).map(UP).includes(q.fb))no.push(`ต้องมีใบรับรองแบรนด์ ${q.fb}`);
  if(q.sr&&!t.sun)no.push('ยังไม่ผ่านทักษะซันรูฟ');if(q.ws&&!t.ws)no.push('ยังไม่ผ่านทักษะกระจกบานหน้า');
  const rad=R.radius[t.level]||R.radius[1];
  if(g.lat!=null&&t.lat!=null&&t.lat!==''){km=hav(+t.lat,+t.lng,+g.lat,+g.lng);if(km>rad)no.push(`ไกลเกินรัศมี ${rad} กม. (${km.toFixed(1)} กม.)`);}
  else{const L=String(b.location||'')+' '+String(b.province||''),A=String(t.area||'').split(/[,\s]+/).filter(Boolean);area=A.some(a=>L.includes(a));if(!area)no.push('ไม่มีพิกัด และพื้นที่ไม่ตรงกับพื้นที่ให้บริการ');}
  const pro=(t.brands||[]).map(UP).includes(q.fb),M=R.match,W=M.w,tw=Object.values(W).reduce((a,x)=>a+(+x||0),0)||1,ld=load(t.id);
  const part={rating:Math.max(0,Math.min(1,((+t.avg||0)-3)/2)),level:t.level/4,dist:km!=null?Math.max(0,1-km/rad):area?.5:0,brand:pro?1:0,load:Math.max(0,1-ld/(M.maxLoad||5))};
  q.hi=hi;const score=Math.round(Object.keys(W).reduce((a,k)=>a+(+W[k]||0)*part[k],0)/tw*100);return {ok:!no.length,no,km,area,q,pro,load:ld,part,score};}
 function rank(b,P=pub()){return P.techs.map(t=>({t,e:elig(t,b,P.rules)})).filter(x=>x.e.ok).sort((a,c)=>c.e.score-a.e.score);}
 function phase(b,P=pub(),now=T()){const C=J('filmpro_claims_v1',{}),c=C[b.id],M=P.rules.match,age=(now-new Date(b.createdAt).getTime())/6e4;
  if(c&&c.tech)return {ph:0,label:c.by==='admin'?'admin มอบหมาย':'มีช่างรับแล้ว',tech:c.tech,age};
  if(age<M.p1Min)return {ph:1,label:`เฟส 1: เสนอ Top ${M.topN}`,left:M.p1Min-age,age};
  if(age<M.p3Min)return {ph:2,label:'เฟส 2: เปิดให้ช่างที่ผ่านเกณฑ์ทุกคน',left:M.p3Min-age,age};
  return {ph:3,label:'เฟส 3: ⚠️ รอ admin มอบหมาย',left:0,age};}
 function visible(t,b,P=pub(),now=T()){const p=phase(b,P,now);if(p.ph===0)return false;const e=elig(t,b,P.rules);if(!e.ok)return false;if(p.ph===1)return rank(b,P).slice(0,P.rules.match.topN).some(x=>x.t.id===t.id);return true;}
 const mmss=m=>{const s=Math.max(0,Math.round(m*60));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
 return {DEF,pub,reqOf,elig,rank,phase,visible,load,hav,mmss,UP};})();
// ---- FilmPro Film seal (shared in Tech, Inspect, Handover): tamper-evident seal sticker number + roll numbers per job package
const FPF=(()=>{const K='filmpro_film_v1',WK='filmpro_warranty_v1',J=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d;}catch(e){return d;}},W=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
 const h=s=>{let x=5381;for(const c of String(s))x=((x<<5)+x+c.charCodeAt(0))>>>0;return x.toString(36).toUpperCase().padStart(7,'0').slice(-7);};
 const U=s=>String(s||'').trim().toUpperCase();
 function code(p){const b=[ 'FP1',p.job,(p.rolls||[]).join(','),U(p.brand),p.series||'',p.shade||'',p.seal].join('|');return b+'|'+h(b);}
 function parse(c){const a=String(c||'').trim().split('|');if(a[0]!=='FP1'||a.length!==8)return null;if(h(a.slice(0,7).join('|'))!==a[7])return {bad:'รหัสถูกแก้ไข/ปลอม (checksum ไม่ตรง)'};return {job:a[1],rolls:a[2].split(',').filter(Boolean),brand:a[3],series:a[4],shade:a[5],seal:a[6]};}
 const all=()=>J(K,{}),get=id=>all()[id],put=(id,o)=>{const A=all();A[id]={...(A[id]||{}),...o};W(K,A);return A[id];};
 function alert_(id,msg){const A=all(),r=A[id]||(A[id]={});(r.alerts=r.alerts||[]).push({at:Date.now(),msg});W(K,A);}
 // validate a scanned code for a job; filmStr e.g. "3M Crystalline"
 function check(c,job,filmStr){const p=parse(c);if(!p)return {ok:false,why:'ไม่ใช่รหัส FilmPro'};if(p.bad)return {ok:false,why:p.bad};const r=get(job);
  if(p.job!==job)return {ok:false,why:`รหัสเป็นของงาน ${p.job} ไม่ใช่ ${job}`,p};if(!r||!r.code)return {ok:false,why:'ไม่พบแพ็กเกจฟิล์มของงานนี้ในระบบ',p};
  if(r.code!==String(c).trim())return {ok:false,why:'รหัสไม่ตรงกับแพ็กเกจที่บริษัทส่ง (ซีล/ม้วนไม่ตรง)',p};
  if(filmStr&&!U(filmStr).startsWith(U(p.brand)+' '+U(p.series).split(' ')[0])&&!U(filmStr).includes(U(p.series)))return {ok:false,why:`ฟิล์มในซีล (${p.brand} ${p.series}) ไม่ตรงกับที่ลูกค้าเลือก (${filmStr})`,p};
  return {ok:true,p,r};}
 // seal-number check (tamper-evident sticker); returns {ok,why,r}
 function sealCheck(job,seal){const r=get(job),v=U(seal);if(!v)return {ok:false,why:'กรอกเลขซีล'};if(!r||!r.seal)return {ok:false,why:'ไม่พบแพ็กเกจฟิล์มของงานนี้ในระบบ'};
  if(U(r.seal)!==v){const o=Object.entries(all()).find(([k,x])=>U(x.seal)===v);return {ok:false,why:o?`เลขซีล ${seal} เป็นของงาน ${o[0]} ไม่ใช่ ${job} (สงสัยสลับฟิล์ม)`:`เลขซีล ${seal} ไม่ตรงกับแพ็กของงานนี้`,r};}
  return {ok:true,r};}
 function wcode(job,roll,card){return 'W-'+h(job+'|'+roll+'|'+card);}
 const war=()=>J(WK,{}),warPut=(c,o)=>{const A=war();A[c]=o;W(WK,A);};

// ---- FilmPro Auto-assign (shared, identical in Inspect & Tech): system offers job to best tech, confirm within timeout, decline/timeout -> next

 function offerNext(b,A,P,now){const skip=new Set(A.history.map(h=>h.tech)),rk=FPM.rank(b,P).filter(x=>!skip.has(x.t.id));
  if(!rk.length){A.state='none';A.tech=null;A.noneAt=now;return;}const x=rk[0];A.state='offered';A.tech=x.t.id;A.score=x.e.score;A.offeredAt=now;A.expires=now+conf(P)*6e4;}
 function tick(now=Date.now()){const P=FPM.pub();if(!P.techs.length)return J(AK,{});const S=J(AK,{}),C=J(CK,{});let ch=false;
  J(BK,[]).filter(b=>b.status!=='cancelled'&&(!b.deposit||b.deposit.status==='paid')).forEach(b=>{if(C[b.id]&&C[b.id].tech){if(S[b.id]&&S[b.id].state==='offered'){S[b.id].state='accepted';ch=true;}return;}
   let A=S[b.id];if(!A){A=S[b.id]={history:[],state:'new'};offerNext(b,A,P,now);ch=true;return;}
   if(A.state==='offered'&&now>=A.expires){const L_=A.history[A.history.length-1];if(!(L_&&L_.tech===A.tech&&L_.res==='decline'))A.history.push({tech:A.tech,res:'timeout',at:A.expires});offerNext(b,A,P,now);ch=true;}});

 function decline(bid,tid,reason,now=Date.now()){const S=tick(now),A=S[bid];if(!A||A.state!=='offered'||A.tech!==tid)return 'งานนี้ไม่ได้มอบให้คุณแล้ว';

  else{delete C[bid];A.state='new';A.tech=null;A.history=[];delete S[bid];}W(AK,S);W(CK,C);}
