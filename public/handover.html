      setupPositionProbePattern(_moduleCount - 7, 0);

        for (var c = -1; c <= 7; c += 1) {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }

      return pattern;

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {

      for (var i = 0; i < 18; i += 1) {

        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);

      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

              if (byteIndex < data.length) {

              var mask = maskFunc(row, col - c);

              bitIndex -= 1;

                byteIndex += 1;
                bitIndex = 7;

          if (row < 0 || _moduleCount <= row) {

            inc = -inc;
            break;
          }

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      var index = 0;

            index += 1;

        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);

      mode = mode || 'Byte';

      var newData = null;

        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {

      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;

          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );

      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';

      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +

      qrSvg += '<path d="';

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  // qrcode.stringToBytes

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }

  qrcode.createStringToBytes = function(unicodeData, numChars) {

    var unicodeMap = function() {

      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};

  const ROLES = { customer: 'ลูกค้า', installer: 'ช่าง', admin: 'แอดมิน', finance: 'การเงิน' };
  const auth = {
    me() { return get(K.session, null); },
    sendOtp(phone) { phone = normPhone(phone); if (phone.length < 9) return { ok: false, why: 'เบอร์โทรไม่ถูกต้อง' };

        document.body.appendChild(d); };
      if (document.body) go(); else document.addEventListener('DOMContentLoaded', go); return false; }
  };

  // ---------- audit ----------
  function audit(act, target, detail) { try { const m = get(K.session, null); mut(s => { s.audit.push({ at: now(), actor: m ? m.role + ':' + m.name : 'guest', act, target: String(target ?? ''), detail: detail == null ? '' : (typeof detail === 'string' ? detail : JSON.stringify(detail).slice(0, 300)) }); if (s.audit.length > 5000) s.audit.splice(0, s.audit.length - 5000); }); } catch (e) { } }

  // ---------- bookings ----------
  const bookings = { all() { return get(K.bookings, []); }, get(id) { return bookings.all().find(b => b.id === id); },
    save(b) { const L = bookings.all(), i = L.findIndex(x => x.id === b.id); if (i < 0) L.push(b); else L[i] = b; set(K.bookings, L); return b; },
    hist(b, ev, note) { const m = auth.me(); (b.history = b.history || []).push({ at: now(), ev, by: m ? m.role : 'customer', note: note || '' }); },
    find(id, phone) { const b = bookings.get(String(id || '').trim().toUpperCase()); return b && normPhone(b.phone) === normPhone(phone) ? b : null; },
    create(o) { const s = suite(); const id = newId(); const total = o.price == null ? null : Math.max(0, o.price - ((o.coupon && o.coupon.discount) || 0));
      const dep = depositFor(total, s.settings);
      const b = { id, createdAt: new Date().toISOString(), status: 'booked', tech: null, ...o, total, deposit: { amount: dep, status: 'unpaid', paidAt: null, payId: null },
        history: [], consent: o.consent && o.consent.pdpa === false ? { pdpa: false } : { pdpa: true, version: s.settings.consentVersion, at: now() } };
      bookings.hist(b, 'จองแล้ว'); bookings.save(b);
      mut(x => { if (b.consent.pdpa) x.consents.push({ bid: id, phone: b.phone, version: s.settings.consentVersion, at: now(), scope: 'booking,photos,location' }); if (o.coupon) { const c = x.coupons.find(c => c.code === o.coupon.code); if (c) c.used = (c.used || 0) + 1; } });
      audit('booking.create', id, { total, dep }); notify('booked', id, { amount: dep }); return b; },
    applyCoupon(id, code) { const b = bookings.get(id); if (!b) return { ok: false, why: 'ไม่พบงาน' }; if (b.deposit.status !== 'unpaid') return { ok: false, why: 'ชำระมัดจำแล้ว ใช้โค้ดไม่ได้' }; if (b.coupon) return { ok: false, why: 'ใช้โค้ดไปแล้ว' };
      const c = coupon.check(code, b.price); if (!c.ok) return c; b.coupon = { code: c.code, discount: c.discount }; b.total = Math.max(0, b.price - c.discount); b.deposit.amount = depositFor(b.total);
      bookings.hist(b, 'ใช้โค้ดส่วนลด', c.code); bookings.save(b); mut(x => { const k = x.coupons.find(y => y.code === c.code); if (k) k.used = (k.used || 0) + 1; x.payments.filter(p => p.bid === id && p.status === 'pending').forEach(p => p.status = 'void'); }); audit('coupon.use', id, c.code); return { ok: true, discount: c.discount }; },
    consent(id) { const b = bookings.get(id); if (!b) return; const v = suite().settings.consentVersion; b.consent = { pdpa: true, version: v, at: now() }; bookings.save(b); mut(x => { x.consents.push({ bid: id, phone: b.phone, version: v, at: now(), scope: 'booking,photos,location' }); }); audit('pdpa.consent', id, v); },
    cancel(id, reason) { const b = bookings.get(id); if (!b) return { ok: false, why: 'ไม่พบงาน' }; const st = stage(b); if (st.key === 'inspected' || st.key === 'handover' || st.key === 'done') return { ok: false, why: 'งานเริ่มแล้ว ยกเลิกไม่ได้' };
      b.status = 'cancelled'; bookings.hist(b, 'ยกเลิก', reason); bookings.save(b);
      const C = get(K.claims, {}); delete C[id]; set(K.claims, C);
      let refund = null; if (b.deposit.status === 'paid') refund = pay.requestRefund(id, 'ยกเลิกงาน: ' + (reason || ''));
      audit('booking.cancel', id, reason); notify('cancelled', id, { note: refund ? 'มัดจำจะคืนภายใน 7 วันทำการ' : '' }); return { ok: true, refund }; },
    reschedule(id, date, time) { const b = bookings.get(id); if (!b) return { ok: false, why: 'ไม่พบงาน' }; if (b.status === 'cancelled') return { ok: false, why: 'งานถูกยกเลิกแล้ว' };
      const st = stage(b); if (['inspected', 'handover', 'done'].includes(st.key)) return { ok: false, why: 'งานเริ่มแล้ว เลื่อนไม่ได้' };
      const dur = duration(b.car && b.car.size, b.sunroof); const sl = schedule.slots(date, b.car && b.car.size, b.sunroof, id).find(x => x.time === time);
      if (!sl || sl.cap <= 0) return { ok: false, why: 'ช่วงเวลานี้เต็มแล้ว' };
      if (b.tech && !schedule.techFree(b.tech, date, toMin(time), dur, id)) { const C = get(K.claims, {}); delete C[id]; set(K.claims, C); b.tech = null; }
      const old = b.date + ' ' + b.time; b.date = date; b.time = time; b.slot = { start: time, end: toHM(toMin(time) + dur), durationMin: dur };
      bookings.hist(b, 'เลื่อนนัด', old + ' → ' + date + ' ' + time); bookings.save(b); audit('booking.reschedule', id, old + '→' + date + ' ' + time); notify('rescheduled', id); return { ok: true }; }
  };
  function depositFor(total, S) { S = S || suite().settings; if (total == null) return S.depositAsk; return Math.min(total, Math.max(S.depositMin, Math.round(total * S.depositPct / 100))); }

  // ---------- installers (published by FilmPro Tech) ----------
  function techs() { const p = get(K.techpub, { techs: [] }); return (p.techs || []).filter(t => t.status !== 'suspended'); }
  const techName = id => (techs().find(t => t.id === id) || {}).name || id || '-';

  // ---------- scheduling ----------
  function duration(size, sunroof) { const d = suite().duration; return (d[size] || d.M) + (sunroof && sunroof !== 'ไม่มี' ? d.sunroof : 0); }
  const schedule = {
    availOf(tid) { return suite().avail[tid] || { days: [1, 2, 3, 4, 5, 6], start: '09:00', end: '18:00', off: [] }; },
    setAvail(tid, a) { mut(s => { s.avail[tid] = a; }); audit('avail.set', tid, a); },
    // intervals [from,to] in minutes for a tech on a date (includes travel buffer)
    busy(tid, date, exceptId) { const S = suite().settings, C = get(K.claims, {}); return bookings.all().filter(b => b.status !== 'cancelled' && b.id !== exceptId && b.date === date && (C[b.id] || {}).tech === tid)
      .map(b => { const s = toMin(b.time), d = (b.slot && b.slot.durationMin) || duration(b.car && b.car.size, b.sunroof); return [s - S.travelMin, s + d + S.travelMin, b.id]; }); },
    works(tid, date, from, dur) { const a = schedule.availOf(tid), wd = new Date(date + 'T00:00:00').getDay(); if (!a.days.includes(wd) || (a.off || []).includes(date)) return false; return from >= toMin(a.start) && from + dur <= toMin(a.end); },
    techFree(tid, date, from, dur, exceptId) { if (!schedule.works(tid, date, from, dur)) return false; return !schedule.busy(tid, date, exceptId).some(([a, b]) => from < b && from + dur > a); },
    // capacity per start time = free installers − unassigned bookings overlapping that window
    slots(date, size, sunroof, exceptId) { const s = suite(), S = s.settings, dur = duration(size, sunroof), T = techs(), C = get(K.claims, {}); const out = [];
      if (!date) return out; const today = ymd(now()), nowMin = new Date().getHours() * 60 + new Date().getMinutes();
      const unas = bookings.all().filter(b => b.status !== 'cancelled' && b.id !== exceptId && b.date === date && !(C[b.id] || {}).tech);
      for (let t = toMin(S.open); t + dur <= toMin(S.close); t += S.slotStep) {
        if (date < today || (date === today && t <= nowMin + 120)) continue;
        const free = T.length ? T.filter(x => schedule.techFree(x.id, date, t, dur, exceptId)).length : S.crews - bookings.all().filter(b => b.status !== 'cancelled' && b.id !== exceptId && b.date === date && overlap(b, t, dur, S)).length;
        const pend = T.length ? unas.filter(b => overlap(b, t, dur, S)).length : 0;
        out.push({ time: toHM(t), end: toHM(t + dur), cap: Math.max(0, free - pend), dur }); }
      return out; },
    freeTechs(bid) { const b = bookings.get(bid); if (!b) return []; const dur = (b.slot && b.slot.durationMin) || duration(b.car && b.car.size, b.sunroof); return techs().filter(t => schedule.techFree(t.id, b.date, toMin(b.time), dur, bid)); },
    assign(bid, tid, reason) { const b = bookings.get(bid); if (!b) return { ok: false, why: 'ไม่พบงาน' }; if (b.status === 'cancelled') return { ok: false, why: 'งานถูกยกเลิก' };
      if (b.deposit.status !== 'paid') return { ok: false, why: 'ยังไม่ได้รับมัดจำ' };
      const dur = (b.slot && b.slot.durationMin) || duration(b.car && b.car.size, b.sunroof); if (!schedule.techFree(tid, b.date, toMin(b.time), dur, bid)) return { ok: false, why: 'ช่างไม่ว่างช่วงเวลานี้ (ชนกับงานอื่น/นอกเวลาทำงาน)' };
      const C = get(K.claims, {}), AS = get(K.assign, {}); C[bid] = { tech: tid, at: now(), by: 'admin', reason: reason || '' }; const a = AS[bid] = AS[bid] || { history: [] }; a.state = 'admin'; a.tech = tid; a.history.push({ tech: tid, res: 'admin', reason: reason || '', at: now() });
      set(K.claims, C); set(K.assign, AS); b.tech = tid; bookings.hist(b, 'มอบหมายช่าง', techName(tid)); bookings.save(b); audit('assign', bid, tid); notify('assigned', bid, { tech: techName(tid) }); return { ok: true }; }
  };
  function overlap(b, t, dur, S) { const s = toMin(b.time), d = (b.slot && b.slot.durationMin) || duration(b.car && b.car.size, b.sunroof); return t < s + d + S.travelMin && t + dur > s - S.travelMin; }

  const offers = {
    mine(tid) { const S = get(K.assign, {}), C = get(K.claims, {}), t = now(); return Object.entries(S).filter(([b, a]) => a.state === 'offered' && a.tech === tid && t < a.expires && !(C[b] && C[b].tech)).map(([b, a]) => ({ bid: b, expires: a.expires, score: a.score, booking: bookings.get(b) })).filter(x => x.booking && x.booking.status !== 'cancelled'); },
    accept(bid, tid) { const S = get(K.assign, {}), A = S[bid]; if (!A || A.state !== 'offered' || A.tech !== tid || now() >= A.expires) return { ok: false, why: 'ข้อเสนอหมดเวลา/มอบให้ช่างอื่นแล้ว' };
      const b = bookings.get(bid), dur = (b.slot && b.slot.durationMin) || duration(b.car && b.car.size, b.sunroof); if (!schedule.techFree(tid, b.date, toMin(b.time), dur, bid)) return { ok: false, why: 'คุณมีงานชนช่วงเวลานี้' };
      A.state = 'accepted'; A.history.push({ tech: tid, res: 'accept', at: now() }); set(K.assign, S); const C = get(K.claims, {}); C[bid] = { tech: tid, at: now(), by: 'system' }; set(K.claims, C);
      b.tech = tid; bookings.hist(b, 'มอบหมายช่าง', techName(tid) + ' (รับงานเอง)'); bookings.save(b); audit('offer.accept', bid, tid); notify('assigned', bid, { tech: techName(tid) }); return { ok: true }; },
    decline(bid, tid, reason) { const S = get(K.assign, {}), A = S[bid]; if (!A || A.state !== 'offered' || A.tech !== tid) return { ok: false, why: 'ไม่มีข้อเสนอนี้แล้ว' };
      A.history.push({ tech: tid, res: 'decline', reason: reason || '', at: now() }); A.expires = now(); set(K.assign, S); audit('offer.decline', bid, tid + ' ' + (reason || '')); return { ok: true }; }
  };
  // ---------- PromptPay (EMVCo QR payload, Thai QR Payment / BOT spec) ----------
  function crc16(s) { let c = 0xFFFF; for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, '0'); }
  const tlv = (id, v) => id + pad(v.length) + v;
  function promptpayPayload(target, amount) { const t = normPhone(target); let acc;
    if (t.length >= 15) acc = tlv('03', t); else if (t.length === 13) acc = tlv('02', t); else acc = tlv('01', ('66' + t.replace(/^0/, '')).padStart(13, '0'));
    let p = tlv('00', '01') + tlv('01', amount ? '12' : '11') + tlv('29', tlv('00', 'A000000677010111') + acc) + tlv('58', 'TH') + tlv('53', '764') + (amount ? tlv('54', Number(amount).toFixed(2)) : '') + '6304';
    return p + crc16(p); }
  function qrSVG(text, cell = 5) { if (typeof qrcode !== 'function') return '<div>QR library missing</div>'; const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: cell, margin: 2 }); }

  // ---------- payments ----------
  const pay = {
    list(bid) { return suite().payments.filter(p => !bid || p.bid === bid); },
    paidTotal(bid) { return pay.list(bid).filter(p => p.status === 'paid').reduce((a, p) => a + p.amount, 0) - suite().refunds.filter(r => r.bid === bid && r.status === 'refunded').reduce((a, r) => a + r.amount, 0); },
    balance(bid) { const b = bookings.get(bid); if (!b || b.total == null) return null; return Math.max(0, b.total - pay.paidTotal(bid)); },
    create(bid, kind, amount) { const b = bookings.get(bid); if (!b) return null; amount = Math.round(Number(amount) * 100) / 100; if (!(amount > 0)) return null;
      const ex = pay.list(bid).find(p => p.kind === kind && p.status === 'pending' && p.amount === amount); if (ex) return ex;
      return mut(s => { s.seq.pay++; const p = { id: 'PAY' + pad(s.seq.pay, 5), bid, kind, amount, status: 'pending', createdAt: now(), payload: promptpayPayload(s.settings.promptpay, amount), to: s.settings.promptpay }; s.payments.push(p); return p; }); },
    markPaid(pid, method, ref) { let p; mut(s => { p = s.payments.find(x => x.id === pid); if (!p || p.status === 'paid') return; s.seq.rc++; p.status = 'paid'; p.paidAt = now(); p.method = method || 'PromptPay'; p.ref = ref || ''; p.receiptNo = 'RC' + new Date().getFullYear() + '-' + pad(s.seq.rc, 5); });
      if (!p) return { ok: false }; const b = bookings.get(p.bid); if (b) { if (p.kind === 'deposit') { b.deposit = { ...b.deposit, status: 'paid', paidAt: now(), payId: pid }; } bookings.hist(b, p.kind === 'deposit' ? 'ชำระมัดจำ' : 'ชำระส่วนที่เหลือ', money(p.amount)); bookings.save(b); }
      audit('payment.paid', pid, { bid: p.bid, amount: p.amount, method }); notify('deposit_paid', p.bid, { amount: p.amount, link: (W.FP_TRACK_URL || 'index.html') + '#receipt/' + pid }); return { ok: true, p: suite().payments.find(x => x.id === pid) }; },
    requestRefund(bid, reason) { const amt = pay.paidTotal(bid); if (amt <= 0) return null; return mut(s => { if (s.refunds.some(r => r.bid === bid && r.status === 'requested')) return null; const r = { id: 'RF' + now().toString(36).toUpperCase(), bid, amount: amt, reason: reason || '', status: 'requested', at: now() }; s.refunds.push(r); return r; }); },
    decideRefund(rid, ok, amount, note) { let r; mut(s => { r = s.refunds.find(x => x.id === rid); if (!r || r.status !== 'requested') { r = null; return; } r.status = ok ? 'refunded' : 'rejected'; if (ok && amount != null) r.amount = Math.min(r.amount, +amount); r.decidedAt = now(); r.note = note || ''; });
      if (!r) return { ok: false }; const b = bookings.get(r.bid); if (b) { if (ok && b.deposit.status === 'paid') b.deposit.status = 'refunded'; bookings.hist(b, ok ? 'คืนเงินแล้ว' : 'ไม่อนุมัติคืนเงิน', money(r.amount)); bookings.save(b); }
      audit('refund.' + (ok ? 'approve' : 'reject'), rid, { bid: r.bid, amount: r.amount }); if (ok) notify('refund', r.bid, { amount: r.amount }); return { ok: true, r }; }
  };

  // ---------- coupons ----------
  const coupon = {
    check(code, total) { code = String(code || '').trim().toUpperCase(); if (!code) return { ok: false, why: '' }; const c = suite().coupons.find(x => x.code === code && x.active !== false);
      if (!c) return { ok: false, why: 'ไม่พบโค้ดนี้' }; if (c.expires && ymd(now()) > c.expires) return { ok: false, why: 'โค้ดหมดอายุ' }; if (c.maxUses && (c.used || 0) >= c.maxUses) return { ok: false, why: 'โค้ดถูกใช้ครบแล้ว' };
      if (total == null) return { ok: false, why: 'ใช้โค้ดได้เมื่อมีราคา' }; if (c.minTotal && total < c.minTotal) return { ok: false, why: 'ยอดขั้นต่ำ ' + money(c.minTotal) };
      const d = c.type === 'pct' ? Math.min(c.maxDiscount || Infinity, Math.round(total * c.value / 100)) : Math.min(total, c.value); return { ok: true, code, discount: d, c }; },
    save(c) { c.code = String(c.code).trim().toUpperCase(); mut(s => { const i = s.coupons.findIndex(x => x.code === c.code); if (i < 0) s.coupons.push({ used: 0, active: true, ...c }); else s.coupons[i] = { ...s.coupons[i], ...c }; }); audit('coupon.save', c.code, c); }
  };

  // ---------- notifications (templates; NO real sending) ----------
  function fill(t, v) { return String(t).replace(/\{(\w+)\}/g, (_, k) => v[k] ?? ''); }
  function notify(ev, bid, extra = {}) { try { const s = suite(), b = bid ? bookings.get(bid) : null; const base = location.href.replace(/[^/]*$/, '');
      const v = { shop: s.settings.shop, id: bid || '', name: b ? b.customer : '', date: b ? b.date : '', time: b ? b.time : '', tech: b ? techName(b.tech) : '', amount: extra.amount != null ? Number(extra.amount).toLocaleString() : '', note: extra.note || '',
        link: base + (extra.link || ((W.FP_TRACK_URL || 'index.html') + '#track/' + (bid || '') + '/' + (b ? normPhone(b.phone) : ''))), ...extra, link2: '' };
      if (extra.link) v.link = base + extra.link; const text = fill(s.templates[ev] || ev, v);
      mut(x => { x.notifications.push({ id: 'N' + now().toString(36) + Math.random().toString(36).slice(2, 5), at: now(), ev, bid: bid || '', to: b ? normPhone(b.phone) : 'admin', text, status: 'draft' }); if (x.notifications.length > 3000) x.notifications.splice(0, x.notifications.length - 3000); });
      return text; } catch (e) { return ''; } }
  const shareLinks = (text, phone) => ({ line: 'https://line.me/R/share?text=' + encodeURIComponent(text), sms: 'sms:' + (phone || '') + '?body=' + encodeURIComponent(text) });

  // ---------- stock (film rolls) ----------
  const stock = {
    list() { return suite().stock; },
