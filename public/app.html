const WINDOW_TH = { front: "บานหน้า", frontSide: "คู่หน้า", rearSide: "คู่หลัง", rear: "บานหลัง", sunroof: "ซันรูฟ", sunroof2: "ซันรูฟ ช่องที่ 2", glassRoof: "หลังคาแก้ว" };
const DECLINE = ["ติดงานอื่นช่วงเวลานั้น", "ไกลเกินไป", "ไม่ถนัดฟิล์มยี่ห้อนี้", "เหตุผลส่วนตัว"];
const CLOSED = ["cancelled", "done", "completed", "closed", "refunded"];

// ---------- data
const data = () => {
  const bookings = J(K.bk, []), claims = J(K.claims, {}), assign = J(K.assign, {}), pub = J(K.pub, {}), ins = (J(K.ins, {}).ins) || {}, ho = (J(K.ho, {}).ho) || {}, rate = J(K.rate, {});

};
const holder = (D, b) => (D.claims[b.id] && D.claims[b.id].tech) || b.tech || null;

const sortByDate = (a, b) => ((a.date || "9") + (a.time || "")).localeCompare((b.date || "9") + (b.time || ""));

  const offers = D.bookings.filter((b) => { const A = D.assign[b.id]; return A && A.state === "offered" && A.tech === ME && A.expires > now && !holder(D, b) && !CLOSED.includes(b.status); }).sort(sortByDate);

}
function stageOf(D, b) {
  const i = D.ins[b.id], h = D.ho[b.id];

  if (h && h.status === "ส่งมอบแล้ว") return { k: "done", t: D.rate[b.id] ? "เสร็จ · ได้รับคะแนนแล้ว" : "ส่งมอบแล้ว", c: "ok", step: 3 };

  if (i) return { k: "inspecting", t: "กำลังตรวจรถ", c: "warn", step: 1 };

}
const TH_DAY = ["อา.", "จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส."], TH_MON = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
const ymd = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

const carText = (b) => [b.car && b.car.brand, b.car && b.car.model].filter(Boolean).join(" ") + (b.car && b.car.size ? ` · ไซส์ ${b.car.size}` : "");

// ---------- actions

// ---------- notifications (built from changes since last look)
function events(D) {

function markRead(ids) { const s = J(K.seen, { snap: {}, read: {} }); s.read = s.read || {}; ids.forEach((i) => s.read[i] = 1); try { localStorage.setItem(K.seen, JSON.stringify(s)); } catch {} }

let route = "open", jobId = null, sheet = null, EV = { items: [], read: {} };

const fmtLeft = (ms) => { const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60; return `เหลือ ${m}:${String(s).padStart(2, "0")}`; };
